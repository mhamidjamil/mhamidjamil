name: Profile metrics

# Renders the stat cards into the metrics-renders branch, so the README never
# depends on a third-party server being up. GITHUB_TOKEN covers public data;
# add a classic PAT as METRICS_TOKEN and swap it in to count private repos too.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: mhamidjamil
          committer_branch: metrics-renders
          filename: metrics.svg
          base: header, repositories
          config_timezone: Asia/Karachi

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: mhamidjamil
          committer_branch: metrics-renders
          filename: metrics.languages.svg
          base: ''
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          config_timezone: Asia/Karachi

      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: mhamidjamil
          committer_branch: metrics-renders
          filename: metrics.achievements.svg
          base: ''
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          config_timezone: Asia/Karachi

      - name: Isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: mhamidjamil
          committer_branch: metrics-renders
          filename: metrics.isocalendar.svg
          base: ''
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_timezone: Asia/Karachi
